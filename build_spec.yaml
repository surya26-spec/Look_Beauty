version: 0.1

component: build

steps:
  - type: Command
    name: Build Step
    timeoutInSeconds: 600
    command: |
      echo "Build started"
      ls -la

  - type: Command
    name: Regression Test
    timeoutInSeconds: 1200
    command: |
      echo "Running regression tests"

      # Initialize project
      npm init -y

      # Install dependencies
      npm install cypress http-server --save-dev

      # Verify Cypress
      npx cypress verify

      # Start local server
      npx http-server . -p 3000 &
      
      echo "Waiting for server..."
      sleep 15

      # Check server is up
      curl -I http://localhost:3000 || exit 1

      # Run Cypress (HEADLESS FIX)
      npx cypress run --headless --browser chrome || exit 1

      echo "Regression tests completed"
