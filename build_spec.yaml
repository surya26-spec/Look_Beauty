version: 0.1

component: build

steps:
  - type: Command
    name: Install Dependencies
    timeoutInSeconds: 600
    command: |
      echo "Installing system + node dependencies"

      # Install Node.js (IMPORTANT FIX)
      curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
      yum install -y nodejs

      # Install required libraries for Cypress
      yum install -y \
        nss \
        libX11 \
        libXcomposite \
        libXcursor \
        libXdamage \
        libXext \
        libXi \
        libXtst \
        libXScrnSaver \
        libXrandr \
        alsa-lib \
        atk \
        cups-libs \
        gtk3 \
        xorg-x11-fonts-Type1 \
        xorg-x11-utils \
        xorg-x11-server-Xvfb

  - type: Command
    name: Build Step
    command: |
      echo "Build started"
      node -v
      npm -v
      ls -la

  - type: Command
    name: Regression Test
    timeoutInSeconds: 1200
    command: |
      echo "Running regression tests"

      # Install dependencies
      npm install cypress http-server --save-dev

      # Start virtual display
      export DISPLAY=:99
      Xvfb :99 &

      # Start server
      npx http-server . -p 3000 &
      sleep 15

      # Verify server
      curl -I http://localhost:3000 || exit 1

      # Run Cypress (most stable flags)
      npx cypress run --headless --no-sandbox --disable-gpu || exit 1

      echo "Regression tests completed"
