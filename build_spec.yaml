version: 0.1

component: build

steps:
  - type: Command
    name: Build and Regression Test
    command: |
      echo "Build started"
      ls -la

      echo "Installing dependencies"
      npm install

      echo "Installing serve"
      npm install -g serve

      echo "Starting server"
      serve . -l 3000 &
      sleep 10

      echo "Running Cypress tests"
      npx cypress run || exit 1
