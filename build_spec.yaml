version: 0.1

component: build

phases:
  build:
    commands:
      - echo "Build started"
      - ls -la

  test:
    commands:
      - echo "Running regression tests"
      - npm install
      - npm install -g serve
      - serve . -l 3000 &
      - sleep 10
      - npx cypress run || exit 1

artifacts:
  - name: web-app
    type: GENERIC
    files:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.jpg"
