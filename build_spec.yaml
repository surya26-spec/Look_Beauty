version: 0.1

component: build

phases:
  build:
    commands:
      - echo "Build started"
      - ls -la

  test:
    commands:
      - echo "Running regression tests"

      # Check required files exist
      - test -f index.html || exit 1
      - test -f style.css || exit 1
      - test -f script.js || exit 1

      # Basic HTML validation (optional)
      - echo "Basic validation passed"

  post_build:
    commands:
      - echo "Preparing artifacts"

artifacts:
  - name: web-app
    type: GENERIC
    files:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.jpg"
