version: 0.1

component: build

steps:
  # -------------------------------
  # 1. Install system dependencies (FIXED)
  # -------------------------------
  - type: Command
    name: Install System Dependencies
    timeoutInSeconds: 600
    command: |
      echo "Installing system dependencies"

      yum install -y \
        nss \
        libX11 \
        libXcomposite \
        libXcursor \
        libXdamage \
        libXext \
        libXi \
        libXtst \
        libXScrnSaver \
        libXrandr \
        alsa-lib \
        atk \
        cups-libs \
        gtk3 \
        xorg-x11-fonts-Type1 \
        xorg-x11-utils \
        xorg-x11-server-Xvfb

  # -------------------------------
  # 2. Build step
  # -------------------------------
  - type: Command
    name: Build Step
    timeoutInSeconds: 600
    command: |
      echo "Build started"
      ls -la

  # -------------------------------
  # 3. Regression Testing (FINAL FIX)
  # -------------------------------
  - type: Command
    name: Regression Test
    timeoutInSeconds: 1200
    command: |
      echo "Running regression tests"

      # Install dependencies
      npm install cypress http-server --save-dev

      # Start virtual display (required for Cypress)
      export DISPLAY=:99
      Xvfb :99 &

      # Start local server
      npx http-server . -p 3000 &
      
      echo "Waiting for server..."
      sleep 15

      # Verify server is running
      curl -I http://localhost:3000 || exit 1

      # Run Cypress (FINAL STABLE COMMAND)
      npx cypress run --browser electron || exit 1

      echo "Regression tests completed"
