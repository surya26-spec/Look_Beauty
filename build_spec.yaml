version: 0.1

component: build

steps:
  # -------------------------------
  # Install system dependencies (FIXED)
  # -------------------------------
  - type: Command
    name: Install System Dependencies
    timeoutInSeconds: 600
    command: |
      echo "Installing system dependencies"

      yum install -y \
        nss \
        libX11 \
        libXcomposite \
        libXcursor \
        libXdamage \
        libXext \
        libXi \
        libXtst \
        libXScrnSaver \
        libXrandr \
        alsa-lib \
        atk \
        cups-libs \
        gtk3 \
        libgbm \
        xorg-x11-fonts-Type1 \
        xorg-x11-utils \
        xorg-x11-server-Xvfb

  # -------------------------------
  # Build step
  # -------------------------------
  - type: Command
    name: Build Step
    timeoutInSeconds: 600
    command: |
      echo "Build started"
      ls -la

  # -------------------------------
  # Regression Testing
  # -------------------------------
  - type: Command
    name: Regression Test
    timeoutInSeconds: 1200
    command: |
      echo "Running regression tests"

      npm install cypress http-server --save-dev

      npx cypress --version

      export DISPLAY=:99
      Xvfb :99 &

      npx http-server . -p 3000 &
      sleep 15

      curl -I http://localhost:3000 || exit 1

      npx cypress run --browser electron || exit 1

      echo "Regression tests completed"
