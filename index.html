<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Look Beauty and Trendy Fashion Studio</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Gold Particles Background -->
<div id="gold-particles"></div>


  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Look Beauty Studio</a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1>Welcome to Look Beauty & Trendy Fashion Studio</h1>
  </section>

  <!-- Gallery -->
  <section id="gallery">
    <div class="container">
      <h2 class="text-center mb-5">Gallery</h2>

      <div class="row g-4 gallery">
        <div class="col-md-4">
          <img src="one.jpg" alt="Makeup Service" />
        </div>
        <div class="col-md-4">
          <img src="two.jpg" alt="Hair Styling" />
        </div>
        <div class="col-md-4">
          <img src="three.jpg" alt="Facial Treatment" />
        </div>
      </div>
    </div>
  </section>

  <!-- Booking -->
  <section id="booking">
    <div class="container">
      <h2 class="text-center mb-4">Book an Appointment</h2>
      <div class="row justify-content-center">
        <div class="col-md-6">

          <form
            id="bookingForm"
            action="https://formspree.io/f/meoljbjn"
            method="POST"
          >
            <input
              type="text"
              name="name"
              class="form-control mb-3"
              placeholder="Your Name"
              required
            />

            <input
              type="email"
              name="email"
              class="form-control mb-3"
              placeholder="Your Email"
              required
            />

            <input
              type="date"
              name="date"
              class="form-control mb-3"
              required
            />

            <select
              name="service"
              class="form-control mb-3"
              required
            >
              <option value="">Select Service</option>
              <option>Hair Styling</option>
              <option>Makeup</option>
              <option>Facials</option>
              <option>Nail Art</option>
            </select>

            <button type="submit" class="btn btn-custom w-100">
              Book Now
            </button>
          </form>

          <div id="bookingMessage" class="mt-3"></div>

        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 Look Beauty & Trendy Fashion Studio
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Formspree JS -->
  <script src="script.js"></script>

</body>
</html>
